<title id="hopjarCardTitle">Hopjar’s glass jar</title>
<desc id="hopjarCardDesc">A glass jar tied with red and white twine, on a night sky, holding five glossy jellies: a purple drop with a meditating figure, a green star with a running shoe, a red square with a book, an orange heart with a dumbbell and a yellow circle with a bike.</desc>
