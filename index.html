<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{
  --ink:#171210;      /* the press bed */
  --bone:#F2EDE4;     /* the mark      */
  --ember:#FF6A1F;    /* the spark     */
  --reveal:cubic-bezier(0.4,0,0.2,1);  /* the show unfolds  */
  --p:0;              /* the wake      */
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pinch-zoom} /* the page is a stage, not a scroll: swipes feed the timeline, never the browser chrome */
body{
  margin:0;background:var(--ink);
  display:grid;place-items:center;
  min-height:100vh;min-height:100svh;
  padding:max(6vmin,1.5rem);
  overflow:hidden;
  touch-action:pinch-zoom;
}
html.burned{--ink:#F2EDE4;--bone:#171210} /* the burned page: paper bed, ink mark (mirrors :root values) */
#plate{position:fixed;left:0;right:0;bottom:9vh;z-index:2;margin:0;text-align:center;pointer-events:none;
  color:var(--bone);
  font:500 15px/1.4 ui-monospace,'SF Mono',Menlo,Consolas,monospace} /* the name stands on both pages */
h1{margin:0;font-size:inherit;letter-spacing:.18em} /* tighter than the old .48em — the long email needs less air */
h1 span{margin:0 -.14em} /* the mono dot floats in a full advance; pull its neighbors in to match the letter rhythm */
.trigger{
  display:block;position:relative;z-index:3;
}
#lure{position:fixed;left:calc(50% - 6px);bottom:4.5vh;z-index:2;width:12px;height:9px;opacity:0;pointer-events:none;
  background:var(--ember);clip-path:polygon(0 0,100% 0,50% 100%);
  animation:lure 2800ms ease-in-out 1600ms infinite} /* one ember falls toward the floor — follow it */
html.rampage #lure{display:none}
@keyframes lure{0%{opacity:0;transform:translateY(-10px)}35%{opacity:.95}60%{opacity:.95}100%{opacity:0;transform:translateY(8px)}}
svg{
  display:block;overflow:visible;
  width:min(58vmin,620px);height:auto;
  /* the type re-sets itself: skeleton, spark, wings, settle */
  --p1:clamp(0,calc(var(--p) / .55),1);            /* Z straightens   */
  --ph:clamp(0,calc((var(--p) - .3) / .15),1);     /* head flips up   */
  --p2:clamp(0,calc((var(--p) - .45) / .45),1);    /* wings unfold    */
  --p3:clamp(0,calc((var(--p) - .78) / .22),1);    /* fire            */
}
.body{fill:var(--bone)}
.hole{fill:var(--ink)}
.acc{fill:var(--ember);animation:pulse 3.6s ease-in-out infinite}
#mark,#spine,#head,#tail,#spark,#fire,.fold,.side,.crown,.eye{transform-box:view-box}
.side{transform-origin:53px 23px;transform:scale(1,calc(1 - var(--ph)))}
.crown{transform-origin:53px 23px;transform:scale(1,var(--ph))}
.eye{transform-origin:59px 19px;animation:blink 6400ms infinite} /* the lid is ink; the Z blinks */
@keyframes blink{0%,93%,100%{transform:scale(1)}95%,97%{transform:scale(1,.07)}}
#mark{
  transform-origin:56.75px 48.85px;
  transform:scale(calc((1 - .22*var(--p2)) * (1 - .6*var(--p)*(1 - var(--p))))) translate(0,calc(4.75px*var(--p2)));
}
#spine{
  transform-origin:53px 50px;
  transform:translate(calc(3.75px*var(--p1)),0) scale(1,calc(1 - .12*var(--p1))) rotate(calc(-45.7deg*var(--p1)));
}
#head{
  transform-origin:53px 23px;
  transform:translate(calc(3.75px*var(--p1)),calc(-22.6px*var(--p1))) scale(calc(1 - .2*var(--p1))) rotate(calc(90deg*var(--p1)));
}
#tail{
  transform-origin:53px 77px;
  transform:translate(calc(3.75px*var(--p1)),calc(31.35px*var(--p1))) scale(calc(1 - .45*var(--p1))) rotate(calc(90deg*var(--p1)));
}
.fold{
  transform-origin:56.75px 42px;
  transform:rotate(calc(58deg*(1 - var(--p2)))) scale(var(--p2),calc(.3 + .7*var(--p2)));
}
#spark{
  transform-origin:53px 23px;
  transform:translate(calc(3.75px*var(--p1)),calc(-22.6px*var(--p1))) scale(calc(1 - .2*var(--p1))) rotate(calc(90deg*var(--p1)));
}
#fire{
  transform-origin:15.5px 28.6px;
  transform:translate(0,calc(-5.6px*var(--ph))) scale(calc(1 + 1.6*var(--p3)));
}
/* ── the rampage: a scroll summons the dragon; it strafes the seam and the page burns ──
   flat like the mark: no filters, no blur — only transform, opacity, and hard-edged clips */
#fx{display:none}
html.rampage #fx{display:contents} /* children stack against the dragon, no wrapper context */
#fx>div{position:fixed;pointer-events:none}
html.rampage{animation:wake 1400ms var(--reveal) both} /* the scroll pulls the mark awake */
html.rampage .trigger{animation:liftoff 800ms cubic-bezier(.6,.05,.9,.5) 1050ms forwards,charge 1250ms cubic-bezier(.4,.08,.62,.92) 2150ms forwards}
html.rampage .body{animation:ignite 1ms linear 2150ms forwards} /* the beast burns ember, flat as the spark */
html.rampage #fire{animation:blaze 130ms linear 2150ms infinite alternate}
html.rampage body{animation:quake 1300ms linear 2150ms} /* the impact shakes the room */
#dim{inset:0;z-index:1;opacity:0;background:color-mix(in srgb,var(--ink) 85%,transparent);
  animation:dimdown 2150ms linear 2150ms forwards} /* the old world recedes so the fire can own the frame */
#preglow{left:0;right:0;bottom:0;height:16vh;z-index:1;opacity:0;background:var(--ember);
  clip-path:polygon(0 100%,0 55%,6% 30%,11% 62%,17% 22%,23% 58%,29% 34%,36% 66%,42% 18%,50% 52%,57% 28%,63% 62%,70% 24%,77% 58%,84% 30%,90% 64%,95% 26%,100% 48%,100% 100%);
  animation:heatgather 1150ms ease-in-out 1400ms forwards} /* flat teeth lick at the floor — something below is coming */
#pyre,#sear{inset:0}
#pyre{z-index:1;transform:scale(1.05,1.025);transform-origin:50% 100%} /* the same seam, one register off — a hard ember rim */
#sear{z-index:2}
#pyre .clip,#sear .clip{position:absolute;inset:0;
  clip-path:polygon(49.2% 112%,48.8% 112%,49.1% 112%,48.9% 112%,49.3% 112%,49% 112%,49.4% 112%,49.6% 111%,50.4% 111%,50.6% 112%,51% 112%,50.7% 112%,51.1% 112%,50.9% 112%,51.2% 112%,50.8% 112%);
  animation:burnspread 2000ms linear 2300ms forwards}
#pyre .clip{background:var(--ember)}
#sear .clip{background:var(--bone)} /* the seam interior is already the new bed — the settle is seamless */
#sear .clip::after{content:"";position:absolute;inset:0;opacity:0;
  background:linear-gradient(to top,var(--ember) 0 9%,color-mix(in srgb,var(--ember) 45%,var(--bone)) 9% 26%,transparent 26%);
  animation:searfade 2000ms linear 2300ms forwards} /* banded heat cools as the burn completes */
#flash{inset:0;z-index:2;opacity:0;background:var(--ember);
  animation:flashpulse 420ms ease-out 2150ms forwards} /* the entry concussion */
#embers{left:-30vw;right:-30vw;top:-120vh;bottom:-10vh;z-index:4;opacity:0;
  background:radial-gradient(circle,var(--ember) 1.4px,transparent 1.4px),radial-gradient(circle,var(--ember) 1px,transparent 1px),radial-gradient(circle,color-mix(in srgb,var(--bone) 80%,transparent) .9px,transparent .9px);
  background-size:97px 143px,61px 89px,131px 211px;background-position:7px 13px,31px 57px,3px 41px;
  animation:emberrise 2200ms linear 2150ms forwards} /* hard sparks outlive the beast */
@keyframes wake{to{--p:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.68}}
@keyframes liftoff{
  0%{transform:translateY(0) scale(1)}
  16%{transform:translateY(2.6vh) scale(.97)} /* coils before springing */
  100%{transform:translateY(-118vh) scale(.8)}
}
@keyframes charge{
  0%{transform:translateY(114vh) scale(1.6)}
  100%{transform:translateY(-140vh) scale(1.2)}
}
@keyframes ignite{to{fill:var(--ember)}}
@keyframes blaze{
  from{transform:translate(0,-5.6px) scale(2.6)}
  to{transform:translate(0,-7px) scale(3.1)}
}
@keyframes quake{
  0%,100%{transform:none}
  8%{transform:translate(2px,-3px) rotate(.2deg)}
  16%{transform:translate(-3px,2px) rotate(-.24deg)}
  24%{transform:translate(3px,1px) rotate(.18deg)}
  32%{transform:translate(-2px,-2px) rotate(-.16deg)}
  40%{transform:translate(2px,2px) rotate(.12deg)}
  55%{transform:translate(-2px,1px) rotate(-.1deg)}
  70%{transform:translate(1px,-1px) rotate(.06deg)}
  85%{transform:translate(-1px,1px) rotate(-.04deg)}
}
@keyframes dimdown{0%{opacity:0}25%{opacity:.35}85%{opacity:.25}100%{opacity:0}}
@keyframes heatgather{
  0%{opacity:0;transform:translateY(15vh)}
  28%{opacity:1;transform:translateY(5vh)}
  46%{opacity:1;transform:translateY(9vh)}
  62%{opacity:1;transform:translateY(6vh)}
  78%{opacity:1;transform:translateY(0)} /* the burst — it breaks through here */
  100%{opacity:0;transform:translateY(-4vh)}
}
@keyframes flashpulse{0%{opacity:0}25%{opacity:.4}100%{opacity:0}}
@keyframes emberrise{
  0%{opacity:0;transform:rotate(7deg) translateY(18vh)} /* the tilt breaks the lattice — sparks, not graph paper */
  12%{opacity:.85}
  85%{opacity:.7}
  100%{opacity:0;transform:rotate(7deg) translateY(-46vh)}
}
/* the seam: a jagged sliver splits at the center, races up behind the dragon, then devours the width */
@keyframes burnspread{
  0%{clip-path:polygon(49.2% 112%,48.8% 112%,49.1% 112%,48.9% 112%,49.3% 112%,49% 112%,49.4% 112%,49.6% 111%,50.4% 111%,50.6% 112%,51% 112%,50.7% 112%,51.1% 112%,50.9% 112%,51.2% 112%,50.8% 112%)}
  42%{clip-path:polygon(45% 110%,42% 88%,45.5% 66%,43% 44%,46% 24%,44% 8%,47% -4%,48.5% -10%,52% -10%,53.5% -4%,56.5% 8%,54% 24%,57.5% 44%,54.5% 66%,58.5% 88%,55.5% 110%)}
  75%{clip-path:polygon(37% 110%,31% 88%,36% 66%,33% 44%,38% 24%,35% 8%,40% -4%,44% -10%,57% -10%,61% -4%,66% 8%,62% 24%,68% 44%,63% 66%,70% 88%,64% 110%)}
  100%{clip-path:polygon(-12% 112%,-15% 88%,-10% 66%,-14% 44%,-9% 24%,-13% 8%,-11% -4%,-15% -12%,115% -12%,111% -4%,115% 8%,110% 24%,114% 44%,109% 66%,115% 88%,112% 112%)}
}
@keyframes searfade{0%{opacity:.9}45%{opacity:.75}80%{opacity:.45}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms !important;animation-iteration-count:1 !important}
  html{transition:none}
}
/* the cabinet: a second screen, cut from the same sheet */
:root{--project-ink:#171210;--meadow:#dce9bd;--forest:#253e2b;--grass:#abc776;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
a:focus-visible{outline:2px solid var(--ember);outline-offset:6px}
.projects-link{position:fixed;top:max(5vmin,1.5rem);right:max(6vmin,1.5rem);z-index:5;display:flex;align-items:center;gap:20px;min-height:44px;color:var(--bone);font:500 12px/1.4 var(--mono);text-decoration:none}
.projects-link span{color:var(--ember)}
.projects-link:hover{text-decoration:underline;text-underline-offset:6px}
#projects{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;background:var(--ink);color:var(--bone);padding:max(5vmin,1.5rem) max(6vmin,1.5rem) 19vh;visibility:hidden;transform:translateY(100%);transition:transform 650ms var(--reveal),visibility 650ms;touch-action:pan-y pinch-zoom}
#projects:target{visibility:visible;transform:translateY(0)}
html:has(#projects:target) .projects-link{visibility:hidden}
.projects-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-shrink:0;padding-bottom:clamp(24px,5vh,54px)}
.projects-head h2{font:500 12px/1.4 var(--mono);letter-spacing:.08em;margin:0}
.projects-head h2 span{color:var(--ember);margin-right:16px}
.projects-close{color:var(--bone);font:500 12px/1.4 var(--mono);text-decoration:none;min-height:44px;display:flex;align-items:center;gap:20px}
.projects-close span{font-size:22px;color:var(--ember)}
.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px);max-width:1120px;width:100%;margin:auto;overflow:auto;overscroll-behavior:contain;padding:6px;min-height:0}
.project{color:var(--bone);text-decoration:none;min-width:0}
.project-art{height:clamp(160px,34vh,390px);display:grid;place-items:center;overflow:hidden;position:relative}
.project-sign{background:var(--ember);color:var(--project-ink)}
.mini-sign{border:3px solid currentColor;border-radius:18px;width:74%;height:61%;display:grid;place-items:center;transform:rotate(-7deg);transition:transform 400ms var(--reveal);font:900 clamp(32px,5.5vw,76px)/.88 'Arial Black',Arial,sans-serif;letter-spacing:-.06em;text-align:center}
.project-pup{background:var(--meadow);color:var(--forest)}
.mini-watch{width:clamp(132px,25vh,280px);aspect-ratio:1;border:8px solid var(--forest);border-radius:50%;position:relative;overflow:hidden;background:var(--meadow);transform:rotate(7deg);transition:transform 400ms var(--reveal)}
.mini-watch::before{content:"";position:absolute;inset:60% 0 0;background:var(--grass);clip-path:polygon(0 20%,35% 0,70% 28%,100% 8%,100% 100%,0 100%)}
.mini-watch time{position:absolute;top:15%;left:12%;font:800 clamp(24px,5vh,54px)/1 Arial,sans-serif;letter-spacing:-.06em}
.mini-watch img{position:absolute;height:56%;width:auto;right:12%;bottom:8%;image-rendering:pixelated}
.project:hover .mini-sign,.project:hover .mini-watch,.project:focus-visible .mini-sign,.project:focus-visible .mini-watch{transform:rotate(0)}
.project-info{border-top:1px solid color-mix(in srgb,var(--bone) 25%,var(--ink));margin-top:22px;padding-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.project-info h3{font:500 clamp(23px,3vw,36px)/1.2 var(--mono);letter-spacing:-.06em;margin:0}
.project-info span{font:400 24px/1 var(--mono);color:var(--ember)}
.project p{font:400 12px/1.7 var(--mono);margin:10px 0 4px;max-width:34em}
.project small{font:400 10px/1.5 var(--mono);color:color-mix(in srgb,var(--bone) 60%,var(--ink))}
@media(max-width:600px){.project-grid{grid-template-columns:1fr;gap:30px}.project-art{height:150px}.mini-sign{font-size:40px}.mini-watch{width:132px}.mini-watch time{font-size:32px}.projects-head{padding-bottom:20px}.project-info{margin-top:16px;padding-top:14px}#plate{font-size:12px}}
@media(prefers-reduced-motion:reduce){#projects,.mini-sign,.mini-watch{transition:none}.mini-sign,.mini-watch{transform:none}}
</style>
</head>

      <div class="project-info"><h3>PixelPup</h3><span aria-hidden="true">↗</span></div>
      <p>A little best friend for your Garmin. Pick your pup.</p>
      <small>GARMIN WATCH FACE · BETA</small>
    </a>
  </div>
</section>
<script>
(()=>{
  const r=document.documentElement,
        meta=document.querySelector('meta[name=theme-color]'),
        rm=matchMedia('(prefers-reduced-motion:reduce)'),
        TOTAL=4400,COMMIT=3400; // past COMMIT the beast is gone — the fire finishes what it started
  let anims=null,target=0,pos=0,raf=0,last=0,busy=false;
  const settle=()=>{
    r.classList.toggle('burned');
    meta.setAttribute('content',getComputedStyle(r).getPropertyValue('--ink').trim());
    setTimeout(()=>busy=false,600); // outlive trackpad momentum
  };
  const disarm=()=>{cancelAnimationFrame(raf);raf=0;anims=null;target=pos=0;r.classList.remove('rampage')};
  const finish=()=>{busy=true;disarm();settle()}; // rampage off + burned on resolve in one recalc — seamless
  const tick=t=>{
    raf=requestAnimationFrame(tick);
    if(target<COMMIT&&t-last>1000)target=Math.max(0,target-14); // untended fire dies back down
    pos+=(target-pos)*.16;
    if(!anims)return;
    if(target>=TOTAL&&pos>TOTAL-16){finish();return}
    if(target<=0&&pos<6){disarm();return}
    const ms=Math.min(pos,TOTAL-1);
    for(const a of anims)a.currentTime=ms;
  };
  const push=d=>{
    if(busy||location.hash==='#projects')return;
    if(rm.matches)return; // reduced motion: the page holds still — no rampage, no flip
    if(!raf){
      if(d<=0)return; // scrolling up at rest summons nothing
      r.classList.add('rampage');
      requestAnimationFrame(()=>{if(r.classList.contains('rampage'))anims=document.getAnimations().filter(a=>a instanceof CSSAnimation&&!/^(pulse|blink|lure)$/.test(a.animationName))}); // idle life keeps its own clock
      raf=requestAnimationFrame(tick);
    }
    last=performance.now();
    target=Math.max(0,Math.min(TOTAL,target+d));
    if(target>COMMIT)target=TOTAL; // point of no return
  };
  const projectsLink=document.querySelector('.projects-link'),
        closeLink=document.querySelector('.projects-close');
  const syncProjects=(focus=false)=>{
    const open=location.hash==='#projects';
    projectsLink.setAttribute('aria-expanded',String(open));
    if(open)disarm();
    if(focus)requestAnimationFrame(()=>(open?closeLink:projectsLink).focus({preventScroll:true}));
  };
  addEventListener('hashchange',()=>syncProjects(true));
  syncProjects();
  addEventListener('wheel' ,e=>{if(!e.ctrlKey&&e.deltaY&&Math.abs(e.deltaY)>=Math.abs(e.deltaX))push(e.deltaY*1.4)},{passive:true});
  let ty=null;
  addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
  addEventListener('touchmove',e=>{if(ty!==null){const y=e.touches[0].clientY;push((ty-y)*3);ty=y}},{passive:true});
  addEventListener('touchend',()=>{ty=null});
  addEventListener('keydown',e=>{
    if(location.hash==='#projects'){if(e.key==='Escape'){e.preventDefault();closeLink.click()}return}
    if(e.key==='ArrowDown')push(320);
    else if(e.key==='PageDown')push(1100);
    else if(e.key==='ArrowUp')push(-320);
    else if(e.key==='PageUp')push(-1100);
  });
})();
</script>
